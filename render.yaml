services:
  - type: web
    name: quantstrike-api
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ANGEL_API_KEY
        value: "6gd28nTZ"
      - key: ANGEL_CLIENT_CODE
        value: "AAAK977461"
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
